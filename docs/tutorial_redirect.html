<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peak Frequency - Video Guide</title>

  <!-- REPLACE with your actual YouTube video URL -->
  <!-- 0-second meta refresh for instant browser redirect -->
  <meta http-equiv="refresh" content="0; url=https://www.youtube.com/watch?v=YOUR_VIDEO_ID">
  <link rel="canonical" href="https://www.youtube.com/watch?v=YOUR_VIDEO_ID">

  <script>
    // Immediate JavaScript redirection fallback
    window.location.replace("https://www.youtube.com/watch?v=YOUR_VIDEO_ID");
  </script>

  <style>
    :root {
      --bg-color: #0d1117;
      --card-bg: #161b22;
      --border-color: #30363d;
      --text-main: #c9d1d9;
      --text-heading: #f0f6fc;
      --accent-cyan: #00e5ff;
      --btn-hover: #00b8cc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
    }

    .redirect-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 2.5rem 2rem;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(0, 229, 255, 0.15);
      border-top-color: var(--accent-cyan);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1.5rem auto;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    h1 {
      color: var(--text-heading);
      font-size: 1.4rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
    }

    p {
      font-size: 0.95rem;
      line-height: 1.5;
      color: #8b949e;
      margin-bottom: 1.75rem;
    }

    .manual-link {
      display: inline-block;
      width: 100%;
      background-color: var(--accent-cyan);
      color: #000000;
      font-size: 0.95rem;
      font-weight: 600;
      padding: 0.8rem 1.25rem;
      border-radius: 6px;
      text-decoration: none;
      transition: background-color 0.15s ease-in-out;
    }

    .manual-link:hover {
      background-color: var(--btn-hover);
    }
  </style>
</head>
<body>

  <main class="redirect-card">
    <div class="spinner"></div>
    <h1>Opening Video Guide...</h1>
    <p>Redirecting you to the Peak Frequency instructional video on YouTube.</p>
    
    <a class="manual-link" href="https://www.youtube.com/watch?v=YOUR_VIDEO_ID" rel="noopener noreferrer">
      Open in YouTube
    </a>
  </main>

</body>
</html>
