<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peak Frequency — Redirecting to Guide</title>
  <link rel="icon" type="image/png" href="assets/app_icon_512x512.png">

  <!-- 0-second meta refresh to the Peak Frequency homepage -->
  <meta http-equiv="refresh" content="0; url=index.html">
  <link rel="canonical" href="https://mesw.github.io/PeakFrequency/">

  <script>
    // Immediate JavaScript redirection fallback
    window.location.replace("index.html");
  </script>

  <style>
    :root {
      --bg: #f6f6f2;
      --surface: #ffffff;
      --border: #dddad1;
      --ink: #1f2421;
      --ink-muted: #535c57;
      --accent: #1d635d;
      --accent-hover: #164e49;
      --radius: 12px;
      --radius-sm: 8px;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 1.5rem;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--ink);
      line-height: 1.6;
    }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .redirect-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2.25rem 2rem;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #d7e5e2;
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1.25rem auto;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    h1 {
      color: var(--ink);
      font-size: 1.35rem;
      font-weight: 700;
      margin: 0 0 0.65rem 0;
    }

    p {
      font-size: 0.95rem;
      color: var(--ink-muted);
      margin: 0 0 1.5rem 0;
    }

    .manual-link {
      display: inline-block;
      width: 100%;
      background: var(--accent);
      color: #ffffff;
      font-size: 0.95rem;
      font-weight: 600;
      padding: 0.75rem 1.25rem;
      border-radius: var(--radius-sm);
      text-decoration: none;
      transition: background-color 0.15s ease-in-out;
    }

    .manual-link:hover {
      background: var(--accent-hover);
    }
  </style>
</head>
<body>

  <main class="redirect-card">
    <div class="spinner" aria-hidden="true"></div>
    <h1>Opening Peak Frequency Guide…</h1>
    <p>Redirecting you to the Peak Frequency breathing guide and browser pacer.</p>
    <a class="manual-link" href="index.html">Open Peak Frequency</a>
  </main>

</body>
</html>
